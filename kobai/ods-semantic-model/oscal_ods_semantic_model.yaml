specification_version: '1.1.0'
created_on: '2026-10-22'
kind: vendor_neutral_ods_semantic_specification
title: OSCAL ODS semantic model for Kobai
reference_oscal_version: '1.2.3'
status: DESIGN_AND_SCHEMA_ONLY_NOT_DEPLOYED
compatibility:
  native_kobai_import_verified: false
  complete_oscal_schema: false
  instruction: Translate this specification into the supported Kobai modeling interface. This is not an OSCAL instance document or a tested native import file.
sharing:
  scope: ODS_SCHEMA_AND_MODEL_DEFINITIONS_ONLY
  table_and_column_names_included: true
  company_records_included: false
  samples_included: false
  upstream_objects_or_mappings_included: false
  credentials_or_connection_endpoints_included: false
  data_access_authorized_by_publication: false
  rule: Share definitions only. Any connection, record access, or activation requires separate authorization; record-level validation remains inside the authorized environment.
notation:
  paths: Conceptual OSCAL paths; [] denotes collection items. Paths are not executable SQL or JSONPath expressions.
  concepts: A concept definition does not prove that matching ODS rows exist or that every listed attribute is populated.
  predicates: Semantic relationship names are proposed labels. Only CONTAINS is specified as the physical dependency label for containment.
  attributes: Selected model attributes, not a complete required-field or schema-conformance contract.
modules:
  SSP:
    name: System Security Plan
    root: system-security-plan
    root_concept: SSP
    description: Describes a system, its characteristics, components, and documented control implementation; the document is not itself a globally reconciled system asset.
    dim_table: DIM_OSCAL_SSP_ELEMENT
    dim_primary_key: PK_OSCAL_SSP_ELEMENT_HASH
    fact_table: FACT_OSCAL_SSP_DEPENDENCY
    fact_primary_key: PK_FACT_OSCAL_DEPENDENCY_HASH
  SECURITY_ASSESSMENT_PLAN:
    name: Assessment Plan
    root: assessment-plan
    root_concept: AssessmentPlan
    description: Describes assessment scope and planned activities. References to an SSP must resolve to an actual document before a cross-model link is activated.
    dim_table: DIM_OSCAL_ASSESSMENT_PLAN_ELEMENT
    dim_primary_key: PK_DIM_OSCAL_ASSESSMENT_PLAN_ELEMENT_HASH
    fact_table: FACT_OSCAL_ASSESSMENT_PLAN_DEPENDENCY
    fact_primary_key: PK_FACT_OSCAL_ASSESSMENT_PLAN_DEPENDENCY_HASH
  ASSESSMENT_RESULTS:
    name: Assessment Results
    root: assessment-results
    root_concept: AssessmentResults
    description: Records assessment results and their observations, findings, and risks. A scalar score or count is an attribute, not evidence identifying an assessed control.
    dim_table: DIM_OSCAL_ASSESSMENT_RESULTS_ELEMENT
    dim_primary_key: PK_DIM_OSCAL_ASSESSMENT_RESULTS_ELEMENT_HASH
    fact_table: FACT_OSCAL_ASSESSMENT_RESULTS_DEPENDENCY
    fact_primary_key: PK_FACT_OSCAL_ASSESSMENT_RESULTS_DEPENDENCY_HASH
  POAM:
    name: Plan of Action and Milestones
    root: plan-of-action-and-milestones
    root_concept: POAM
    description: Organizes remediation tracking and references to associated risks and observations. An item reference does not guarantee complete remediation details.
    dim_table: DIM_OSCAL_POAM_ELEMENT
    dim_primary_key: PK_DIM_OSCAL_POAM_ELEMENT_HASH
    fact_table: FACT_OSCAL_POAM_DEPENDENCY
    fact_primary_key: PK_FACT_OSCAL_POAM_DEPENDENCY_HASH
  CATALOG:
    name: Catalog
    root: catalog
    root_concept: Catalog
    description: Organizes control definitions and nested control groups. A control definition is distinct from a system-specific implemented requirement.
    dim_table: DIM_OSCAL_CATALOG_ELEMENT
    dim_primary_key: PK_DIM_OSCAL_CATALOG_ELEMENT_HASH
    fact_table: FACT_OSCAL_CATALOG_DEPENDENCY
    fact_primary_key: PK_FACT_OSCAL_CATALOG_DEPENDENCY_HASH
ods_contract:
  qualification: '<ODS_DATABASE>.<ODS_SCHEMA>.<table_name>'
  qualification_note: Resolve database and schema internally. ODS is the integration boundary, not a claim that the physical schema is named ODS.
  evidence: Table names and column types were inspected in configuration and loader definitions. Current live schema, row population, and deployed version were not queried for this publication.
  live_schema_verified: false
  primary_key_type: BINARY(16)
  dim_shared_columns:
    ELEMENT_TYPE: {type: 'VARCHAR(64)', purpose: "Element-kind discriminator; combine with owner path and model."}
    OSCAL_UUID: {type: 'VARCHAR(32)', purpose: "Warehouse UUID stored without hyphens; not every payload has a uuid member."}
    METADATA_JSON: {type: VARIANT, purpose: "Element payload; distinguish scalar members from inline collections and separate child elements."}
    SOURCE_SYSTEM_NAME: {type: 'VARCHAR(100)', purpose: "ODS provenance column definition only; no values or upstream connection instructions are published."}
    SOURCE_TABLE_NAME: {type: 'VARCHAR(128)', purpose: "ODS provenance column definition only; no upstream object identifiers are published."}
    SOURCE_RECORD_ID: {type: 'VARCHAR(128)', purpose: "ODS provenance identifier; not the primary key for every element and not necessarily a nested item's identifier."}
    DW_PIPELINE_RUN_ID: {type: 'VARCHAR(64)', purpose: "Technical load lineage; not a business join key."}
    DW_LOAD_TIMESTAMP: {type: 'TIMESTAMP_TZ(9)', purpose: "Technical load timestamp; not automatically a business effective date."}
    DW_LOAD_TIMESTAMP_TZ: {type: 'TIMESTAMP_TZ(9)', purpose: "Technical timezone-aware load timestamp."}
  fact_shared_columns:
    FK_SOURCE_ELEMENT_HASH: {type: 'BINARY(16)', purpose: "Parent endpoint for CONTAINS."}
    FK_TARGET_ELEMENT_HASH: {type: 'BINARY(16)', purpose: "Child endpoint for CONTAINS."}
    DEPENDENCY_TYPE: {type: 'VARCHAR(32)', purpose: "Physical relationship label; filter CONTAINS for hierarchy."}
    SOURCE_OSCAL_UUID: {type: 'VARCHAR(32)', purpose: "Parent warehouse UUID for endpoint consistency checks."}
    TARGET_OSCAL_UUID: {type: 'VARCHAR(32)', purpose: "Child warehouse UUID for endpoint consistency checks."}
  nullability_note: The inspected loader expects the primary keys and FACT columns to be non-null; DIM non-key columns are nullable. Confirm the deployed contract internally.
  not_dedicated_dim_columns: [ELEMENT_PATH, PARENT_NODE_PATH, INSTANCE_KEY, PARENT_INSTANCE_KEY]
  sequence_column_present: false
  hierarchy_join:
    aliases: {p: parent row in the model DIM, c: child row in the same model DIM, f: row in the matching model FACT}
    parent_expression: 'f.FK_SOURCE_ELEMENT_HASH = p.<dim_primary_key>'
    child_expression: 'f.FK_TARGET_ELEMENT_HASH = c.<dim_primary_key>'
    filter: "f.DEPENDENCY_TYPE = 'CONTAINS'"
    endpoint_check: 'f.SOURCE_OSCAL_UUID = p.OSCAL_UUID AND f.TARGET_OSCAL_UUID = c.OSCAL_UUID'
    scope: Resolve both endpoints in their configured model table and owning document. Never join across all DIM tables by a display label.
  key_transport: Compare hashes in binary form inside Snowflake. For an authorized adapter that needs text, use one consistent hexadecimal encoding on both endpoints without changing identity.
concepts:
  SSP: {module: SSP, kind: document, path: "system-security-plan", element_type_hint: system-security-plan}
  SystemCharacteristics:
    module: SSP
    kind: singleton_object
    path: system-security-plan.system-characteristics
    element_type_hint: system-characteristics
    description: One characteristics object per SSP; system-name is a member, not another node. The object is not a collection.
    attributes: {system-name: string, system-name-short: string, description: "markup_multiline", date-authorized: date}
    system_name_binding: {owner: SystemCharacteristics, column: METADATA_JSON, member: system-name, snowflake_expression: 'METADATA_JSON:"system-name"::STRING', separate_node: false}
  SystemImplementation: {module: SSP, kind: singleton_object, path: "system-security-plan.system-implementation", element_type_hint: system-implementation}
  ComponentOccurrence:
    module: SSP
    kind: collection_item
    path: system-security-plan.system-implementation.components[]
    element_type_hint: components
    description: A component occurrence within one SSP, not an automatically deduplicated enterprise asset.
    attributes: {uuid: uuid, type: string, title: markup_line, description: "markup_multiline"}
  ControlImplementation: {module: SSP, kind: singleton_object, path: "system-security-plan.control-implementation", element_type_hint: control-implementation}
  ImplementedRequirement:
    module: SSP
    kind: collection_item
    path: system-security-plan.control-implementation.implemented-requirements[]
    element_type_hint: implemented-requirements
    description: System-specific implementation of a referenced control; do not equate this object with the catalog control definition.
    attributes: {uuid: uuid, control-id: token, description: "markup_multiline"}
  AssessmentPlan: {module: SECURITY_ASSESSMENT_PLAN, kind: document, path: "assessment-plan", element_type_hint: assessment-plan}
  AssessmentTask: {module: SECURITY_ASSESSMENT_PLAN, kind: collection_item, path: "assessment-plan.tasks[]", recursive_member: "tasks[]", element_type_hint: tasks, attributes: {uuid: uuid, type: token, title: markup_line}}
  AssessmentResults: {module: ASSESSMENT_RESULTS, kind: document, path: "assessment-results", element_type_hint: assessment-results}
  AssessmentResult: {module: ASSESSMENT_RESULTS, kind: collection_item, path: "assessment-results.results[]", element_type_hint: results, attributes: {uuid: uuid, title: markup_line, start: date_time, end: date_time}}
  Observation: {module: ASSESSMENT_RESULTS, kind: collection_item, path: "assessment-results.results[].observations[]", element_type_hint: observations, attributes: {uuid: uuid, title: markup_line, description: "markup_multiline"}}
  Finding: {module: ASSESSMENT_RESULTS, kind: collection_item, path: "assessment-results.results[].findings[]", element_type_hint: findings, activation: REQUIRES_ODS_REPRESENTATION_VALIDATION, attributes: {uuid: uuid, title: markup_line, description: "markup_multiline"}}
  Risk: {modules: [ASSESSMENT_RESULTS, POAM], kind: collection_item, paths: ["assessment-results.results[].risks[]", "plan-of-action-and-milestones.risks[]"], element_type_hint: risks, activation: REQUIRES_ODS_REPRESENTATION_VALIDATION, attributes: {uuid: uuid, title: markup_line, description: "markup_multiline", status: token}}
  POAM: {module: POAM, kind: document, path: "plan-of-action-and-milestones", element_type_hint: plan-of-action-and-milestones}
  POAMItem: {module: POAM, kind: collection_item, path: "plan-of-action-and-milestones.poam-items[]", element_type_hint: poam-items, attributes: {uuid: uuid, title: markup_line, description: "markup_multiline"}}
  Catalog: {module: CATALOG, kind: document, path: "catalog", element_type_hint: catalog}
  CatalogGroup: {module: CATALOG, kind: collection_item, path: "catalog.groups[]", recursive_member: "groups[]", element_type_hint: groups, description: "Repeated nested groups require full ancestor context; the groups label alone does not identify the level.", attributes: {id: token, title: markup_line}}
  CatalogControl: {module: CATALOG, kind: collection_item, paths: ["catalog.controls[]", "catalog.groups[].controls[]"], recursive_member: "controls[]", element_type_hint: controls, activation: REQUIRES_ODS_REPRESENTATION_VALIDATION, description: "Controls may occur in recursively nested groups; resolve each control within its catalog context.", attributes: {id: token, title: markup_line}}
  Metadata: {modules: all_bound_modules, kind: singleton_object, relative_path: "metadata", element_type_hint: metadata, attributes: {title: markup_line, version: string, oscal-version: string, last-modified: date_time}}
  Party: {modules: all_bound_modules, kind: collection_item, relative_path: "metadata.parties[]", element_type_hint: parties, attributes: {uuid: uuid, type: token, name: string}}
  Role: {modules: all_bound_modules, kind: collection_item, relative_path: "metadata.roles[]", element_type_hint: roles, attributes: {id: token, title: markup_line}}
  ResponsibleAssignment: {modules: all_bound_modules, kind: collection_item, relative_path: "metadata.responsible-parties[]", element_type_hint: responsible-parties, description: "A scoped role-to-party assignment, not itself a person.", attributes: {role-id: token, party-uuids: uuid_array}}
  PropertyOccurrence:
    modules: all_bound_modules
    kind: representation_dependent
    relative_path: '<owning_object>.props[]'
    element_type_hint: props
    description: A named property can be a separate DIM element or inline in its owner's payload. Preserve owner, namespace, name, class, and group when present; names alone do not guarantee uniqueness.
    attributes: {name: token, ns: uri, class: token, group: token, value: string_or_explicit_warehouse_null}
    binding_rule: Bind only approved properties at their verified owner; this publication intentionally includes no company-specific property dictionary or property values.
identity:
  node: Use the existing model DIM primary key with its table namespace; do not recompute keys from labels or payload values.
  scope: Preserve model, owning document, and occurrence context. Common concept names do not merge instances across documents.
  singleton: Identity belongs to the owning document and element path, not the system-name value.
  collection: Preserve stored item identity. Do not substitute row position or title, and do not assume that changing a value always retains the same key.
  uuid: Normalize hyphenated payload UUID references and stored UUID text only for comparison; preserve document scope and reject ambiguous matches.
  assets: Canonical real-world asset resolution is separate from document-occurrence identity and needs an approved rule.
path_resolution:
  selection: Element-type filters are hints until matched to internally confirmed ODS parent/path definitions.
  root: Start at the model's root element and follow explicit CONTAINS edges.
  descendants: Resolve each child against the permitted parent and element path; reject zero or multiple path matches.
  nested_groups: Retain every group ancestor; do not assign a group level from the groups label alone.
  fallback: If paths cannot be uniquely reconstructed, an internal owner must supply approved ODS-only path metadata or an internal adapter. Do not invent paths or request upstream table access.
  arrays: Inline arrays and separately stored child nodes require different extractors; a dotted path is not proof of another DIM row.
relationship_policy:
  default_activation: DISABLED_PENDING_INTERNAL_VALIDATION
  containment_status: ODS_RULE_DEFINED_NOT_LIVE_TESTED
  reference_status: DESIGN_ONLY_UNTIL_EXPLICIT_ODS_REFERENCE_IS_RESOLVED
  derived_status: DERIVED_FROM_VALIDATED_RELATIONSHIPS_NOT_A_NEW_PHYSICAL_FACT
  materialization: Do not manufacture missing nodes or edges to make the conceptual diagram complete.
  cardinality: Check root ownership, parent counts, and reference multiplicity internally; this selected vocabulary does not assert full OSCAL schema completeness.
relationships:
  - {id: SSP_HAS_CHARACTERISTICS, from: SSP, to: SystemCharacteristics, kind: containment, rule: "Direct CONTAINS edge with resolved parent and child paths."}
  - {id: SSP_HAS_IMPLEMENTATION, from: SSP, to: SystemImplementation, kind: containment, rule: "Direct ownership of the system-implementation object."}
  - {id: IMPLEMENTATION_HAS_COMPONENT, from: SystemImplementation, to: ComponentOccurrence, kind: containment, rule: "Direct ownership of a components item."}
  - {id: SSP_DOCUMENTS_COMPONENT, from: SSP, to: ComponentOccurrence, kind: derived, via: [SSP_HAS_IMPLEMENTATION, IMPLEMENTATION_HAS_COMPONENT], rule: "Traverse both edges; do not claim a direct stored SSP-to-component edge."}
  - {id: SSP_HAS_CONTROL_IMPLEMENTATION, from: SSP, to: ControlImplementation, kind: containment, rule: "Direct ownership of the control-implementation object."}
  - {id: IMPLEMENTATION_HAS_REQUIREMENT, from: ControlImplementation, to: ImplementedRequirement, kind: containment, rule: "Direct ownership of an implemented-requirements item."}
  - {id: REQUIREMENT_REFERENCES_CONTROL, from: ImplementedRequirement, to: CatalogControl, kind: reference, rule: "Resolve control-id in an explicitly established catalog or resolved-profile context; never join bare control IDs across unrelated catalogs."}
  - {id: PLAN_HAS_TASK, from: AssessmentPlan, to: AssessmentTask, kind: containment, rule: "Direct ownership of a root task; nested tasks use TASK_HAS_SUBTASK."}
  - {id: TASK_HAS_SUBTASK, from: AssessmentTask, to: AssessmentTask, kind: containment, rule: "Direct task-to-task ownership only where that nested representation is verified."}
  - {id: RESULTS_HAS_RESULT, from: AssessmentResults, to: AssessmentResult, kind: containment, rule: "Direct ownership of a results item."}
  - {id: RESULT_HAS_OBSERVATION, from: AssessmentResult, to: Observation, kind: containment, rule: "Direct ownership of an observations item."}
  - {id: RESULT_HAS_FINDING, from: AssessmentResult, to: Finding, kind: containment, rule: "Requires an actual findings item; a count or generic property is not a finding node."}
  - {id: RESULT_HAS_RISK, from: AssessmentResult, to: Risk, kind: containment, rule: "Requires an actual risk item under this result."}
  - {id: FINDING_USES_OBSERVATION, from: Finding, to: Observation, kind: reference, rule: "Resolve related-observations[].observation-uuid within the applicable assessment context."}
  - {id: FINDING_IDENTIFIES_RISK, from: Finding, to: Risk, kind: reference, rule: "Resolve related-risks[].risk-uuid within the applicable assessment context."}
  - {id: POAM_HAS_ITEM, from: POAM, to: POAMItem, kind: containment, rule: "Direct ownership of a poam-items item."}
  - {id: POAM_HAS_RISK, from: POAM, to: Risk, kind: containment, rule: "Requires an actual risk item in this POAM."}
  - {id: POAM_ITEM_TRACKS_RISK, from: POAMItem, to: Risk, kind: reference, rule: "Resolve related-risks[].risk-uuid within the POAM context."}
  - {id: CATALOG_HAS_GROUP, from: Catalog, to: CatalogGroup, kind: containment, rule: "Direct ownership of a root group."}
  - {id: GROUP_HAS_SUBGROUP, from: CatalogGroup, to: CatalogGroup, kind: containment, rule: "Direct ownership of a nested group with the full ancestor chain."}
  - {id: CATALOG_HAS_CONTROL, from: Catalog, to: CatalogControl, kind: containment, rule: "Requires a native controls item directly under the catalog root."}
  - {id: GROUP_HAS_CONTROL, from: CatalogGroup, to: CatalogControl, kind: containment, rule: "Requires a native controls item directly under the resolved group."}
  - {id: CONTROL_HAS_SUBCONTROL, from: CatalogControl, to: CatalogControl, kind: containment, rule: "Direct nested-control ownership within the same catalog context."}
  - {id: PLAN_REFERENCES_SSP, from: AssessmentPlan, to: SSP, kind: cross_model_reference, rule: "Resolve import-ssp.href to the actual SSP document; sharing a provenance identifier is insufficient."}
  - {id: RESULTS_REFERENCE_PLAN, from: AssessmentResults, to: AssessmentPlan, kind: cross_model_reference, rule: "Resolve import-ap.href to the actual assessment plan."}
  - {id: POAM_REFERENCES_SSP, from: POAM, to: SSP, kind: cross_model_reference, rule: "Resolve import-ssp.href when present; a standalone system identifier does not invent an SSP document."}
  - {id: METADATA_HAS_PARTY, from: Metadata, to: Party, kind: containment, rule: "Direct ownership within the same document metadata."}
  - {id: METADATA_HAS_ROLE, from: Metadata, to: Role, kind: containment, rule: "Direct ownership within the same document metadata."}
  - {id: METADATA_HAS_ASSIGNMENT, from: Metadata, to: ResponsibleAssignment, kind: containment, rule: "Direct ownership within the same document metadata."}
  - {id: ASSIGNMENT_REFERENCES_PARTY, from: ResponsibleAssignment, to: Party, kind: reference, rule: "Resolve each party-uuids member against scoped party identity."}
  - {id: ASSIGNMENT_REFERENCES_ROLE, from: ResponsibleAssignment, to: Role, kind: reference, rule: "Resolve role-id against the role definition in the same scope."}
relationship_templates:
  DOCUMENT_HAS_METADATA: {for_each: all_bound_modules, from: module_root_concept, to: Metadata, kind: containment, rule: "Resolve a direct CONTAINS edge to that document's metadata; do not merge metadata across models."}
  OWNER_HAS_PROPERTY: {for_each: approved_property_owners, to: PropertyOccurrence, kind: representation_dependent, rule: "Use CONTAINS only for separate property nodes; inline properties remain scoped attributes or explicitly derived semantic occurrences without invented warehouse keys."}
lineage:
  scope: ODS_SCHEMA_LEVEL_ONLY
  structural: Preserve the ODS table binding, owning element path, endpoint keys, and relationship rule in the semantic design; no key values are included.
  audit_columns: [DW_PIPELINE_RUN_ID, DW_LOAD_TIMESTAMP, DW_LOAD_TIMESTAMP_TZ]
  provenance_columns: [SOURCE_SYSTEM_NAME, SOURCE_TABLE_NAME, SOURCE_RECORD_ID]
  value_policy: No lineage values, run identifiers, source identifiers, or source-field values are published. Existing provenance is not permission to traverse outside ODS.
  separate_lineage_table: NOT_ASSERTED_BY_THIS_SPECIFICATION
  missing_lineage: Do not fabricate a lineage table, provenance value, or object reference when absent.
unresolved_relationships:
  - {from: Observation, to: CatalogControl, proposed: ASSESSES_CONTROL, requirement: "Explicit control-target evidence and catalog scope; scores and counts are insufficient."}
  - {from: POAMItem, to: Finding, proposed: ADDRESSES_FINDING, requirement: "A verified cross-reference; shared names or risk descriptions are insufficient."}
  - {from: Risk, to: Risk, proposed: SAME_RISK_ACROSS_MODELS, requirement: "Explicit identity or provenance evidence; two occurrences are not merged because their descriptions match."}
optional_context:
  PROFILE: {description: "Selects and tailors controls from imported catalogs or profiles.", physical_binding: NOT_INCLUDED, rule: "Do not invent a DIM or FACT table or an import link."}
  COMPONENT_DEFINITION: {description: "Describes reusable components and supported control implementations.", physical_binding: NOT_INCLUDED, rule: "Do not equate a component occurrence with a reusable definition without an explicit link."}
implementation:
  vendor_deliverable: Build concept types, property definitions, named relationship rules, and ODS table mappings from the specification without receiving company records.
  internal_prerequisites: Confirm deployed schemas, owner paths, materialization, property selection, and reference resolvers inside the authorized environment.
  validation: Check duplicate keys, endpoint resolution, parent ownership, reference multiplicity, and missing-versus-explicit-null behavior without exporting records.
  access: This publication grants no data access and requests no extracts or sample uploads.
  changes: No source pipelines, warehouse identities, DIM/FACT rows, or table definitions are modified by this specification.
references:
  oscal: https://pages.nist.gov/OSCAL-Reference/models/v1.2.3/
  ssp: https://pages.nist.gov/OSCAL-Reference/models/v1.2.3/system-security-plan/json-reference/
  plan: https://pages.nist.gov/OSCAL-Reference/models/v1.2.3/assessment-plan/json-reference/
  results: https://pages.nist.gov/OSCAL-Reference/models/v1.2.3/assessment-results/json-outline/
  poam: https://pages.nist.gov/OSCAL-Reference/models/v1.2.3/plan-of-action-and-milestones/json-outline/
  catalog: https://pages.nist.gov/OSCAL-Reference/models/v1.2.3/catalog/json-outline/
  kobai_modeling: https://help.kobai.io/knowledge-model-introduction
