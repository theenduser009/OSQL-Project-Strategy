name: Verify public approved commit artifact
on:
  push:
    branches: [main]
    paths:
      - 'run/09_APPROVED_DEV_COMMIT.py'
      - '.github/workflows/verify-approved-commit-artifact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile only; never execute the commit adapter
        run: python -m py_compile run/09_APPROVED_DEV_COMMIT.py
      - name: Confirm exact privately tested artifact bytes
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          data = Path("run/09_APPROVED_DEV_COMMIT.py").read_bytes()
          actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          assert actual == "4edad1e3082a3f66e9880acec77f438aab5043b0", actual
          print("PASS: exact approved adapter artifact; no warehouse execution")
          PY
